<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时短线选股看板 · 5大策略</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>实时短线选股看板</h1>
    <p>5大策略 · 信号强弱 · 买卖决策 · 质量评分 · 胜率说明</p>
  </div>
  <div class="top-actions">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="输入代码，如 002354" autocomplete="off">
      <button id="searchBtn" type="button">查看</button>
    </div>
    <button id="refreshBtn" type="button">立即扫描</button>
    <div class="status-wrap">
      <span id="marketStatus" class="status loading">连接中</span>
      <span id="updateTime" class="time">--</span>
    </div>
  </div>
</header>

<section class="index-strip" id="indexStrip">
  <div class="strip-title">指数行情</div>
  <div class="strip-cards" id="indexCards"></div>
  <div class="market-state-card" id="marketStateCard">
    <div class="ms-label">市场状态</div>
    <div class="ms-value" id="marketStateValue">计算中</div>
    <div class="ms-detail" id="marketStateDetail">--</div>
  </div>
</section>

<section class="control-row">
  <div class="seg-group" id="poolSeg">
    <button type="button" data-pool="lt10" class="active">低价池 ≤10元</button>
    <button type="button" data-pool="all">全市场候选</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
    <span id="progressText">等待扫描</span>
  </div>
</section>

<section class="strategy-cards" id="strategyCards"></section>

<section class="panel strategy-detail">
  <div class="panel-head">
    <h2>策略逻辑与胜率</h2>
    <span class="panel-note">点击标签查看单个策略</span>
  </div>
  <div class="strat-tabs" id="stratTabs"></div>
  <div class="strat-panel" id="stratPanel"></div>
</section>

<section class="panel signal-pool">
  <div class="panel-head">
    <h2>实时信号池</h2>
    <span class="panel-note" id="signalMeta">--</span>
  </div>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>代码</th>
          <th>名称</th>
          <th>现价</th>
          <th>涨跌幅</th>
          <th>触发策略</th>
          <th>信号</th>
          <th>质量</th>
          <th>能否买</th>
          <th>操作方法</th>
          <th>止损</th>
          <th>止盈</th>
          <th>仓位</th>
        </tr>
      </thead>
      <tbody id="signalBody"></tbody>
    </table>
  </div>
</section>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="股票详情">
  <button class="drawer-close" id="drawerClose" type="button">关闭</button>
  <div id="drawerContent"></div>
</aside>

<footer class="footer">
  数据源：腾讯行情 / 新浪行情 / 东方财富 F10，仅供研究参考，不构成投资建议。胜率为历史回测结果，不代表未来表现。
</footer>

<script src="app.js"></script>
</body>
</html>
