name: Refresh short-term data

on:
  schedule:
    - cron: '*/10 1-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pool and kline snapshot
        run: node scripts/build_short_data.js
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/short/data
          git diff --cached --quiet || git commit -m "更新短线行情快照"
          git push
